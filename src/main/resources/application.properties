spring.application.name=parkflow
server.port=9090

spring.datasource.url=jdbc:h2:file:./database/appdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "update" cria as tabelas/colunas novas (ex.: coluna tipo) sem apagar os dados existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# O console do H2 dá acesso total ao banco, por isso fica desligado por padrão.
# Para usar em desenvolvimento: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.h2.console.enabled=false

# Páginas de erro nunca mostram detalhes internos
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.whitelabel.enabled=false

# Cookie de sessão inacessível ao JavaScript e não enviado por outros sites
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Administrador criado automaticamente quando o banco não tem nenhum ADMIN.
# Em produção, defina PARKFLOW_ADMIN_EMAIL e PARKFLOW_ADMIN_SENHA e troque a senha após o primeiro login.
parkflow.admin.nome=${PARKFLOW_ADMIN_NOME:Administrador}
parkflow.admin.email=${PARKFLOW_ADMIN_EMAIL:admin@parkflow.com}
parkflow.admin.senha=${PARKFLOW_ADMIN_SENHA:admin1234}
