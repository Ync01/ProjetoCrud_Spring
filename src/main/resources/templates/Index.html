<!DOCTYPE html> <html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema CRUD</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --background: #f8fafc;
            --danger-bg: #fef2f2;
            --danger-text: #b91c1c;
            --success-bg: #f0fdf4;
            --success-text: #15803d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(99, 102, 241, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(139, 92, 246, 0.18),
                    transparent 35%
                ),
                var(--background);

            color: var(--text);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            position: relative;
            overflow: hidden;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 24px;

            padding: 42px;

            box-shadow:
                0 25px 50px -12px rgba(15, 23, 42, 0.18);

            animation: aparecer 0.55s ease;
        }

        .login-card::before {
            content: "";

            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            height: 5px;

            background: linear-gradient(
                90deg,
                var(--primary),
                var(--secondary)
            );
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 32px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 18px;

            border-radius: 18px;

            color: white;

            font-size: 28px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            box-shadow:
                0 12px 25px rgba(99, 102, 241, 0.28);
        }

        .login-card h1 {
            margin: 0 0 8px;

            color: var(--text);

            font-size: 28px;
            font-weight: 750;

            text-align: center;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 0;

            color: var(--muted);

            font-size: 15px;
            line-height: 1.5;

            text-align: center;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            color: var(--text);

            font-size: 14px;
            font-weight: 650;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 16px;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 16px;

            pointer-events: none;
        }

        .form-control {
            width: 100%;
            height: 52px;

            padding: 0 16px 0 44px;

            color: var(--text);

            background-color: #fff;

            border: 1px solid var(--border);
            border-radius: 12px;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .form-control:hover {
            border-color: #cbd5e1;
        }

        .form-control:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.12);

            outline: none;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-check {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-bottom: 24px;
            padding-left: 0;
        }

        .form-check-input {
            width: 17px;
            height: 17px;

            margin: 0;

            border: 1px solid #cbd5e1;

            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .form-check-input:focus {
            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .form-check-label {
            color: var(--muted);

            font-size: 14px;

            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            height: 52px;

            border: 0;
            border-radius: 12px;

            color: #fff;

            font-size: 15px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            box-shadow:
                0 8px 20px rgba(99, 102, 241, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .btn-login:hover {
            color: #fff;

            transform: translateY(-2px);

            filter: brightness(1.03);

            box-shadow:
                0 12px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .mensagem-erro,
        .mensagem-sucesso {
            display: flex;
            align-items: center;

            gap: 10px;

            padding: 13px 15px;

            margin-bottom: 22px;

            border-radius: 12px;

            font-size: 14px;
            line-height: 1.4;
        }

        .mensagem-erro {
            color: var(--danger-text);

            background: var(--danger-bg);

            border: 1px solid #fecaca;
        }

        .mensagem-sucesso {
            color: var(--success-text);

            background: var(--success-bg);

            border: 1px solid #bbf7d0;
        }

        .footer-text {
            margin-top: 26px;

            color: #94a3b8;

            font-size: 12px;

            text-align: center;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 34px 24px;
                border-radius: 20px;
            }

            .login-card h1 {
                font-size: 25px;
            }

            .brand-icon {
                width: 58px;
                height: 58px;

                font-size: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

</head> <body>
<main class="login-container">

    <section class="login-card">

        <div class="brand">

            <div class="brand-icon" aria-hidden="true">
                CRUD
            </div>

            <h1>Bem-vindo!</h1>

            <p class="subtitle">
                Entre na sua conta para continuar
            </p>

        </div>

        <!-- Mensagem de erro -->
        <div
                th:if="${param.error}"
                class="mensagem-erro"
                role="alert"
        >
            <span aria-hidden="true">⚠</span>

            <span>
                E-mail ou senha incorretos.
            </span>
        </div>

        <!-- Mensagem de logout -->
        <div
                th:if="${param.logout}"
                class="mensagem-sucesso"
                role="status"
        >
            <span aria-hidden="true">✓</span>

            <span>
                Você saiu da sua conta.
            </span>
        </div>

        <form action="/auth" method="post">

            <div class="form-group">

                <label
                        for="email"
                        class="form-label"
                >
                    E-mail
                </label>

                <div class="input-wrapper">

                    <span
                            class="input-icon"
                            aria-hidden="true"
                    >
                        ✉
                    </span>

                    <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="username"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                    >

                </div>

            </div>

            <div class="form-group">

                <label
                        for="password"
                        class="form-label"
                >
                    Senha
                </label>

                <div class="input-wrapper">

                    <span
                            class="input-icon"
                            aria-hidden="true"
                    >
                        ●
                    </span>

                    <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                    >

                </div>

            </div>

            <div class="form-check">

                <input
                        class="form-check-input"
                        type="checkbox"
                        id="remember"
                        name="remember-me"
                >

                <label
                        class="form-check-label"
                        for="remember"
                >
                    Lembrar de mim
                </label>

            </div>

            <button
                    type="submit"
                    class="btn btn-primary btn-login"
            >
                Entrar
            </button>

        </form>

        <p class="footer-text">
            Acesso seguro ao sistema
        </p>

    </section>

</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body> </html>
