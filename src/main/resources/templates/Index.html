<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #667eea 0%,
                #764ba2 100%
            );

            font-family: Arial, Helvetica, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.20);

            animation: aparecer 0.5s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            text-align: center;
            color: #333333;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777777;
            margin-bottom: 30px;
        }

        .form-label {
            color: #333333;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
            border: 1px solid #dddddd;

            padding: 10px 14px;

            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #667eea;

            box-shadow:
                0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .form-control::placeholder {
            color: #aaaaaa;
        }

        .form-check {
            margin-top: 5px;
        }

        .form-check-input {
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }

        .form-check-label {
            color: #666666;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            font-size: 16px;
            font-weight: 600;

            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .voltar {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #667eea;

            text-decoration: none;

            font-weight: 600;

            transition: color 0.3s ease;
        }

        .voltar:hover {
            color: #764ba2;
        }

        .mensagem-erro {
            background-color: #ffe5e5;
            color: #b42318;

            border: 1px solid #ffcccc;

            border-radius: 8px;

            padding: 10px 12px;

            margin-bottom: 20px;

            text-align: center;
        }

        .mensagem-sucesso {
            background-color: #e6f7ed;
            color: #16794c;

            border: 1px solid #b7e4c7;

            border-radius: 8px;

            padding: 10px 12px;

            margin-bottom: 20px;

            text-align: center;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h2>Bem-vindo!</h2>

        <p class="subtitle">
            Entre na sua conta para continuar
        </p>

        <!-- Mensagem de erro -->
        <div
                th:if="${param.error}"
                class="mensagem-erro"
        >
            E-mail ou senha incorretos.
        </div>

        <!-- Mensagem de logout -->
        <div
                th:if="${param.logout}"
                class="mensagem-sucesso"
        >
            Você saiu da sua conta.
        </div>

        <form action="/auth" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">
                    E-mail
                </label>

                <input type="email" class="form-control" id="email" name="username"
                       placeholder="Digite seu e-mail" autocomplete="email" required>

            </div>

            <!-- Senha -->
            <div class="mb-3">

                <label
                        for="password"
                        class="form-label"
                >
                    Senha
                </label>

                <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                >

            </div>

            <!-- Lembrar -->
            <div class="form-check mb-4">

                <input
                        class="form-check-input"
                        type="checkbox"
                        id="remember"
                        name="remember-me"
                >

                <label
                        class="form-check-label"
                        for="remember"
                >
                    Lembrar de mim
                </label>

            </div>

            <!-- Botão -->
            <button
                    type="submit"
                    class="btn btn-primary btn-login"
            >
                Entrar
            </button>

        </form>

    </div>

</div>

<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
