<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkFlow - Cadastro de Veículos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .top-bar {
            max-width: 1000px;
            margin: 0 auto 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .link-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .link-back:hover {
            color: var(--text);
        }

        .wrapper {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.8rem;
        }

        .card h2 {
            margin-bottom: 1.2rem;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.7rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 0.75rem;
            border-radius: var(--radius);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            text-align: left;
            padding: 0.7rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .actions a {
            color: var(--primary);
            text-decoration: none;
            margin-right: 0.8rem;
            font-size: 0.85rem;
        }

        .actions a.delete {
            color: #ef4444;
        }

        .actions a:hover {
            text-decoration: underline;
        }

        .empty {
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 1rem 0;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="logo">ParkFlow</div>
    <a href="/ParkFlow" class="link-back">&larr; Voltar</a>
</div>

<div class="wrapper">
    <div class="card">
        <h2 th:text="${veiculo.id == null} ? 'Cadastrar veículo' : 'Editar veículo'">Cadastrar veículo</h2>

        <form th:action="${veiculo.id == null} ? '/veiculos' : '/veiculos/atualizar/' + ${veiculo.id}" method="post">

            <div class="form-group">
                <label for="placa">Placa</label>
                <input type="text" id="placa" name="placa" th:value="${veiculo.placa}" placeholder="ABC1D23" required>
            </div>

            <div class="form-group">
                <label for="modelo">Modelo</label>
                <input type="text" id="modelo" name="modelo" th:value="${veiculo.modelo}" placeholder="Digite o modelo" required>
            </div>

            <div class="form-group">
                <label for="color">Cor</label>
                <input type="text" id="color" name="color" th:value="${veiculo.color}" placeholder="Digite a cor" required>
            </div>

            <div class="form-group">
                <label for="observacao">Observação</label>
                <textarea id="observacao" name="observacao" rows="3" placeholder="Opcional" th:text="${veiculo.observacao}"></textarea>
            </div>

            <button type="submit" class="btn" th:text="${veiculo.id == null} ? 'Cadastrar' : 'Salvar alterações'">Cadastrar</button>
        </form>
    </div>

    <div class="card">
        <h2>Veículos cadastrados</h2>

        <table th:if="${!veiculos.isEmpty()}">
            <thead>
            <tr>
                <th>Placa</th>
                <th>Modelo</th>
                <th>Cor</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${veiculos}">
                <td th:text="${v.placa}"></td>
                <td th:text="${v.modelo}"></td>
                <td th:text="${v.color}"></td>
                <td class="actions">
                    <a th:href="'/veiculos/editar/' + ${v.id}">Editar</a>
                    <a class="delete" th:href="'/veiculos/deletar/' + ${v.id}" onclick="return confirm('Excluir este veículo?')">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>

        <p class="empty" th:if="${veiculos.isEmpty()}">Nenhum veículo cadastrado ainda.</p>
    </div>
</div>

</body>
</html>
