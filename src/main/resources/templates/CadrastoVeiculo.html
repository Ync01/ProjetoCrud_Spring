<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkFlow - Cadastro de Veículos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --green: #22c55e;
            --red: #ef4444;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #253449;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseDot {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
            70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .top-bar {
            max-width: 1000px;
            margin: 0 auto 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInDown 0.5s ease both;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .link-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-block;
        }

        .link-back:hover {
            color: var(--text);
            transform: translateX(-3px);
        }

        .tabs {
            max-width: 1000px;
            margin: 0 auto 1.5rem;
            display: flex;
            gap: 0.5rem;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.35rem;
            animation: fadeInDown 0.55s ease both;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.65rem 1rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
        }

        .tab-btn:hover {
            color: var(--text);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .tab-btn:active {
            transform: scale(0.97);
        }

        .tab-panel {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.35s ease both;
        }

        .wrapper {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.8rem;
            animation: scaleIn 0.4s ease both;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            border-color: #3d5375;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .card h2 {
            margin-bottom: 1.2rem;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge-count {
            background-color: var(--bg);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.55rem;
            border-radius: 999px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.7rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 0.75rem;
            border-radius: var(--radius);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        .btn:active {
            transform: translateY(0);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            text-align: left;
            padding: 0.7rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        tbody tr {
            animation: fadeInUp 0.4s ease both;
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background-color: var(--surface-2);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.4rem;
            background-color: var(--green);
            animation: pulseDot 1.8s infinite;
        }

        .status-dot.saiu {
            background-color: var(--text-muted);
            animation: none;
        }

        .actions a, .actions button {
            color: var(--primary);
            text-decoration: none;
            margin-right: 0.8rem;
            font-size: 0.85rem;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            padding: 0;
            transition: color 0.2s ease;
        }

        .actions .saida-btn {
            color: var(--green);
            font-weight: 600;
        }

        .actions a.delete, .actions .delete-btn {
            color: var(--red);
        }

        .actions a:hover, .actions button:hover {
            text-decoration: underline;
        }

        .empty {
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 1rem 0;
            animation: fadeIn 0.4s ease both;
        }

        @media (max-width: 720px) {
            .wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="logo">ParkFlow</div>
    <a href="/ParkFlow" class="link-back">&larr; Voltar</a>
</div>

<div class="tabs">
    <button type="button" class="tab-btn active" data-tab="entrada" onclick="mudarTab('entrada')">Entrada de Veículo</button>
    <button type="button" class="tab-btn" data-tab="saida" onclick="mudarTab('saida')">Saída de Veículo</button>
</div>

<div class="tab-panel active" id="panel-entrada">
    <div class="wrapper">
        <div class="card" style="animation-delay: 0.05s">
            <h2 th:text="${veiculo.id == null} ? 'Cadastrar veículo' : 'Editar veículo'">Registrar veiculo</h2>

            <form th:action="${veiculo.id == null} ? '/veiculos' : '/veiculos/atualizar/' + ${veiculo.id}" method="post">

                <div class="form-group">
                    <label for="placa">Placa</label>
                    <input type="text" id="placa" name="placa" th:value="${veiculo.placa}" placeholder="ABC1D23" required>
                </div>

                <div class="form-group">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" name="modelo" th:value="${veiculo.modelo}" placeholder="Digite o modelo" required>
                </div>

                <div class="form-group">
                    <label for="color">Cor</label>
                    <input type="text" id="color" name="color" th:value="${veiculo.color}" placeholder="Digite a cor" required>
                </div>

                <div class="form-group">
                    <label for="observacao">Observação</label>
                    <textarea id="observacao" name="observacao" rows="3" placeholder="Opcional" th:text="${veiculo.observacao}"></textarea>
                </div>

                <button type="submit" class="btn" th:text="${veiculo.id == null} ? 'Registrar entrada' : 'Salvar alterações'">Cadastrar</button>
            </form>
        </div>

        <div class="card" style="animation-delay: 0.1s">
            <h2>Veículos no pátio
                <span class="badge-count" th:text="${#lists.size(veiculos.?[dataSaida == null])}">0</span>
            </h2>

            <table th:if="${!veiculos.?[dataSaida == null].isEmpty()}">
                <thead>
                <tr>
                    <th>Placa</th>
                    <th>Modelo</th>
                    <th>Cor</th>
                    <th>Entrada</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v, iStat : ${veiculos.?[dataSaida == null]}" th:style="'animation-delay: ' + ${iStat.index * 0.05} + 's'">
                    <td><span class="status-dot"></span><span th:text="${v.placa}"></span></td>
                    <td th:text="${v.modelo}"></td>
                    <td th:text="${v.color}"></td>
                    <td th:text="${#temporals.format(v.dataEntrada, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="actions">
                        <a th:href="'/veiculos/editar/' + ${v.id}">Editar</a>
                        <a class="saida-btn" th:href="'/veiculos/saida/' + ${v.id}">Dar saída</a>
                        <a class="delete" th:href="'/veiculos/deletar/' + ${v.id}" onclick="return confirm('Excluir este veículo?')">Excluir</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <p class="empty" th:if="${veiculos.?[dataSaida == null].isEmpty()}">Nenhum veículo no pátio no momento.</p>
        </div>
    </div>
</div>

<div class="tab-panel" id="panel-saida">
    <div class="card">
        <h2>Histórico de saídas
            <span class="badge-count" th:text="${#lists.size(veiculos.?[dataSaida != null])}">0</span>
        </h2>

        <table th:if="${!veiculos.?[dataSaida != null].isEmpty()}">
            <thead>
            <tr>
                <th>Placa</th>
                <th>Modelo</th>
                <th>Cor</th>
                <th>Entrada</th>
                <th>Saída</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v, iStat : ${veiculos.?[dataSaida != null]}" th:style="'animation-delay: ' + ${iStat.index * 0.05} + 's'">
                <td><span class="status-dot saiu"></span><span th:text="${v.placa}"></span></td>
                <td th:text="${v.modelo}"></td>
                <td th:text="${v.color}"></td>
                <td th:text="${#temporals.format(v.dataEntrada, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(v.dataSaida, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="actions">
                    <a class="delete" th:href="'/veiculos/deletar/' + ${v.id}" onclick="return confirm('Excluir este veículo?')">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>

        <p class="empty" th:if="${veiculos.?[dataSaida != null].isEmpty()}">Nenhuma saída registrada ainda.</p>
    </div>
</div>

<script>
    function mudarTab(nome) {
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.tab === nome);
        });
        document.querySelectorAll('.tab-panel').forEach(function (panel) {
            panel.classList.remove('active');
        });
        var alvo = document.getElementById('panel-' + nome);
        alvo.classList.add('active');
    }
</script>

</body>
</html>
