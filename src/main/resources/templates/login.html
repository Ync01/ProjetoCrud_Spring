<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkFlow - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="centralizado">

<div class="auth-card">
    <div class="auth-header">
        <div class="logo">ParkFlow</div>
        <p class="subtitle">Acesse o sistema de gestão do estacionamento</p>
    </div>

    <div th:replace="~{fragments/mensagens :: mensagens}"></div>

    <form action="/autenticar" method="post">
        <input type="hidden" name="_csrf" th:value="${csrfToken}">

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-bloco">Entrar</button>
    </form>

    <div class="footer-links">
        <p>Não tem uma conta? <a href="/cadastro">Cadastre-se</a></p>
    </div>
</div>

</body>
</html>
