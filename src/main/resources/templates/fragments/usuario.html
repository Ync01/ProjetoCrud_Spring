<!-- Nome e perfil do usuário logado, com o botão Sair (POST + CSRF) -->
<div class="user-menu" th:fragment="menu" xmlns:th="http://www.thymeleaf.org">
    <button type="button" id="userMenuButton" aria-expanded="false" aria-controls="userDropdown" class="btn user-btn" onclick="toggleUserMenu()">
        <span th:text="${usuarioNome}">Usuário</span>
        <span class="badge-perfil" th:classappend="${ehAdmin} ? 'admin'" th:text="${usuarioTipo}">USER</span>
    </button>
    <div class="dropdown" id="userDropdown">
        <a href="/home">Início</a>
        <a href="/veiculos">Veículos</a>
        <a href="/admin/usuarios" th:if="${ehAdmin}">Usuários</a>
        <form action="/logout" method="post">
            <input type="hidden" name="_csrf" th:value="${csrfToken}">
            <button type="submit">Sair</button>
        </form>
    </div>
    <script>
        function toggleUserMenu() {
            var dropdown = document.getElementById('userDropdown');
            var open = dropdown.classList.toggle('show');
            document.getElementById('userMenuButton').setAttribute('aria-expanded', String(open));
        }

        document.addEventListener('click', function (event) {
            var menu = document.querySelector('.user-menu');
            var dropdown = document.getElementById('userDropdown');
            if (menu && dropdown && !menu.contains(event.target)) {
                dropdown.classList.remove('show');
                document.getElementById('userMenuButton').setAttribute('aria-expanded', 'false');
            }
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && document.getElementById('userDropdown').classList.contains('show')) {
                document.getElementById('userDropdown').classList.remove('show');
                var button = document.getElementById('userMenuButton');
                button.setAttribute('aria-expanded', 'false');
                button.focus();
            }
        });
        document.querySelector('.user-menu').addEventListener('focusout', function (event) {
            if (!this.contains(event.relatedTarget)) {
                document.getElementById('userDropdown').classList.remove('show');
                document.getElementById('userMenuButton').setAttribute('aria-expanded', 'false');
            }
        });
    </script>
</div>
