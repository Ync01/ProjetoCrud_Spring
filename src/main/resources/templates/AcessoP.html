<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Acesso permitido | Sistema CRUD</title>

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --background: #f8fafc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(99, 102, 241, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(139, 92, 246, 0.18),
                    transparent 35%
                ),
                var(--background);
        }

        .container {
            position: relative;

            width: 100%;
            max-width: 500px;

            padding: 48px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 24px;

            box-shadow:
                0 25px 50px -12px rgba(15, 23, 42, 0.18);

            overflow: hidden;

            animation: aparecer 0.55s ease;
        }

        .container::before {
            content: "";

            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--secondary)
                );
        }

        .icone {
            width: 88px;
            height: 88px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 26px;

            border-radius: 50%;

            color: var(--success);

            background: var(--success-light);

            border: 8px solid #dcfce7;

            font-size: 38px;
            font-weight: 800;

            box-shadow:
                0 10px 25px rgba(22, 163, 74, 0.12);
        }

        h1 {
            margin: 0 0 12px;

            color: var(--text);

            font-size: 30px;
            font-weight: 750;

            letter-spacing: -0.5px;
        }

        .descricao {
            max-width: 360px;

            margin: 0 auto 30px;

            color: var(--muted);

            font-size: 16px;
            line-height: 1.6;
        }

        .status {
            display: inline-flex;
            align-items: center;

            gap: 8px;

            margin-bottom: 30px;
            padding: 8px 14px;

            color: var(--success);

            background: var(--success-light);

            border: 1px solid #bbf7d0;
            border-radius: 999px;

            font-size: 13px;
            font-weight: 650;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 0 4px rgba(22, 163, 74, 0.1);
        }

        .botao {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 180px;
            height: 50px;

            padding: 0 24px;

            border-radius: 12px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            text-decoration: none;

            font-size: 15px;
            font-weight: 700;

            box-shadow:
                0 8px 20px rgba(99, 102, 241, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .botao:hover {
            color: white;

            transform: translateY(-2px);

            filter: brightness(1.03);

            box-shadow:
                0 12px 25px rgba(99, 102, 241, 0.3);
        }

        .botao:active {
            transform: translateY(0);
        }

        .footer-text {
            margin: 26px 0 0;

            color: #94a3b8;

            font-size: 12px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .container {
                padding: 40px 24px;
                border-radius: 20px;
            }

            h1 {
                font-size: 26px;
            }

            .icone {
                width: 78px;
                height: 78px;

                font-size: 32px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

</head> <body>
<main class="container">

    <div
            class="icone"
            aria-hidden="true"
    >
        ✓
    </div>

    <div class="status">
        <span class="status-dot"></span>
        Autenticação concluída
    </div>

    <h1>
        Acesso permitido!
    </h1>

    <p class="descricao">
        Login realizado com sucesso.
        Você possui permissão para acessar esta página.
    </p>

    <a
            href="/Index.html"
            class="botao"
    >
        Voltar
    </a>

    <p class="footer-text">
        Sistema CRUD
    </p>

</main>

</body> </html>
