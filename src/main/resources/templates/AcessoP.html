<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesso Permitido</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
            );
        }

        .container {
            width: 90%;
            max-width: 500px;

            background: white;

            padding: 50px 40px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);

            animation: aparecer 0.6s ease;
        }

        .icone {
            width: 90px;
            height: 90px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #e6f7ed;

            color: #16794c;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 50px;

            font-weight: bold;
        }

        h1 {
            color: #16794c;

            margin-bottom: 15px;
        }

        p {
            color: #666;

            font-size: 17px;

            margin-bottom: 30px;
        }

        .botao {
            display: inline-block;

            padding: 13px 30px;

            border-radius: 10px;

            text-decoration: none;

            color: white;

            font-weight: bold;

            background: linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
            );

            transition: 0.3s;
        }

        .botao:hover {
            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icone">
        ✓
    </div>

    <h1>Acesso permitido!</h1>

    <p>
        Login realizado com sucesso.
        Você tem permissão para acessar esta página.
    </p>

    <a href="/Index.html" class="botao">
        Voltar
    </a>

</div>

</body>
</html>
