<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkFlow - Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/interface.js}" defer></script>
</head>
<body class="auth-page">
<a class="skip-link" href="#conteudo">Pular para o formulário</a>
<aside class="auth-story"><a class="logo" href="/apresentacao.html">ParkFlow</a><div><h2>Seu acesso.<br><span>Uma nova visão.</span></h2><p class="story-description">Crie sua conta para consultar os veículos e acompanhar o histórico do estacionamento.</p><img class="parking-art" th:src="@{/img/parking-plan.svg}" width="600" height="480" alt="" aria-hidden="true"></div><a class="text-link" href="/apresentacao.html">Conheça o projeto ↗</a></aside>
<main class="auth-main" id="conteudo">

<div class="auth-card">
    <div class="auth-header">
        <span class="eyebrow">Primeiro acesso</span>
        <h1>Criar conta</h1>
        <p class="subtitle">Seu cadastro dá acesso à consulta de veículos e histórico.</p>
    </div>

    <div th:replace="~{fragments/mensagens :: mensagens}"></div>

    <form action="/usuarios" method="post">
        <input type="hidden" name="_csrf" th:value="${csrfToken}">

        <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" th:value="${usuario.nome}" placeholder="Digite seu nome" autocomplete="name" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" th:value="${usuario.email}" placeholder="exemplo@email.com" autocomplete="email" required>
        </div>

        <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" th:value="${usuario.cpf}" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <div class="password-field"><input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-password-toggle="senha" aria-controls="senha" aria-pressed="false" hidden>Mostrar</button></div>
        </div>

        <div class="form-group">
            <label for="dataNascimento">Data de nascimento</label>
            <input type="date" id="dataNascimento" name="dataNascimento" th:value="${usuario.dataNascimento}" required>
        </div>

        <button type="submit" class="btn btn-metal btn-bloco">Criar minha conta</button>
    </form>

    <div class="footer-links">
        <p>Já tem uma conta? <a href="/login">Fazer login</a></p>
    </div>

    <footer th:replace="~{fragments/footer :: rodape}"></footer>
</div>

<script>
    // Máscara simples de CPF: 12345678909 -> 123.456.789-09
    document.getElementById('cpf').addEventListener('input', function () {
        var numeros = this.value.replace(/\D/g, '').slice(0, 11);
        numeros = numeros
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        this.value = numeros;
    });
</script>

</main>
</body>
</html>
